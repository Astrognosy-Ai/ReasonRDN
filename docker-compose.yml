version: '3.8'

services:
  reasonrdn:
    build: .
    container_name: reasonrdn
    ports:
      - "8501:8501" # Streamlit Dashboard
      - "8765:8765" # Memory Node API
    volumes:
      # Persistent storage for memory database, indexes, and metrics
      - reasonrdn_data:/root/.reason-rdn
      # Persistent config file
      - reasonrdn_config:/root/.reason-ecosystem.cfg
    environment:
      # Local-first by default. Set REASON_USE_NETWORK=1 explicitly when the
      # container should use the WARF Gateway and Reason Registry.
      REASON_USE_NETWORK: "${REASON_USE_NETWORK:-0}"
    restart: unless-stopped

volumes:
  reasonrdn_data:
  reasonrdn_config:
